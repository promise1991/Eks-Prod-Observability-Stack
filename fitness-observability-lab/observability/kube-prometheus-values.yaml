grafana:
  adminPassword: admin123
  service:
    type: LoadBalancer
  additionalDataSources:
    - name: Loki
      type: loki
      url: http://loki.monitoring.svc:3100
      isDefault: false
    - name: Tempo
      type: tempo
      url: http://tempo.monitoring.svc:3100
      isDefault: false
prometheus:
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    retention: 7d